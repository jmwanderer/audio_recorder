<html>
    <head>
        <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    </head>
    <body>
        <h1>Audio Files</h1>
        {% include "recording.html" %}
        <table cellpadding="15">
            {% for entry in entries %}
            <tr hx-target="this" hx-swap="outerHTML">
                <td>{{ entry["timestamp"].strftime("%A, %d %B %Y %I:%M%p") }}</td>
                <td>{{ entry["length"] }}s</td>
                <td><audio src='./file/{{ entry["basename"] }}' controls='' controlslist='nodownload'></audio></td>
                <td><a href='./file/{{ entry["basename"] }}'>Download</a></td>
                <td>
                    <button hx-post="/file/{{ entry['basename'] }}" name="action" value="delete">Delete</button>
                </td>
                <td>
                    <button hx-post="/file/{{ entry['basename'] }}" name="action" value="airplane">Airplane</button>
                </td>
                <td>
                    <button hx-post="/file/{{ entry['basename'] }}" name="action" value="dog">Dog</button>
                </td>
                <td>
                    <button hx-post="/file/{{ entry['basename'] }}" name="action" value="siren">Siren</button>
                </td>
            </tr>
            {% endfor %}
        </table>
    </body>
</html>
