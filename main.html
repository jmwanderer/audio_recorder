<html>
    <head>
        <script src="https://unpkg.com/htmx.org@2.0.4"></script>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>
        <div class="container my-4">
            <h1 class="mb-4">Audio Files</h1>
            {% include "recording.html" %}
            <div id="day-section" hx-target="this" hx-swap="outerHTML">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <button class="btn btn-outline-secondary"
                        {% if prev_day %}
                            hx-get="{{ url_for('main_page').include_query_params(date=prev_day) }}"
                            hx-select="#day-section"
                            hx-push-url="true"
                        {% else %}
                            disabled
                        {% endif %}>
                            &laquo; Previous Day
                    </button>
                    <strong class="fs-5">{{ day.strftime("%A, %d %B %Y") }}</strong>
                    <button class="btn btn-outline-secondary"
                        {% if next_day %}
                            hx-get="{{ url_for('main_page').include_query_params(date=next_day) }}"
                            hx-select="#day-section"
                            hx-push-url="true"
                        {% else %}
                            disabled
                        {% endif %}>
                            Next Day &raquo;
                        </button>
                </div>
                <table class="table table-striped align-middle">
                    {% for entry in entries %}
                    {% include "row.html" %}
                    {% endfor %}
                </table>
            </div>
        </div>
    </body>
</html>
