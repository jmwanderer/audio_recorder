<div hx-target="this" hx-swap="outerHTML" class="d-flex align-items-center gap-2 mb-3">
  {%if recording %}
  <span class="badge text-bg-success">Recording Enabled</span>
  <button
    class="btn btn-sm btn-outline-danger"
    hx-post="{{ url_for('post_record') }}"
    name='record' value='stop'>Disable Recording</button>
  {% else %}
  <span class="badge text-bg-secondary">Recording Disabled</span>
  <button
    class="btn btn-sm btn-outline-success"
    hx-post="{{ url_for('post_record') }}"
    name='record' value='start'>Enable Recording</button>
  {% endif %}
</div>
